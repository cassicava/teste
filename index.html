<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roldão Pastel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Roldão Pastel</h1>
</header>

<main>
  <nav id="menu-categorias">
    <a href="#pastel_salgado" class="active">Salgado</a>
    <a href="#pastel_especial">Especial</a>
    <a href="#pastel_doce">Doce</a>
    <a href="#bebidas">Bebidas</a>
  </nav>

  <section id="pastel_salgado" class="tipos">
    <h2>PASTÉIS SALGADOS</h2>
    <div id="lista-produtos-salgados"></div>
  </section>

  <section id="pastel_especial" class="tipos">
    <h2>PASTÉIS ESPECIAIS</h2>
    <div id="lista-produtos-especiais"></div>
  </section>

  <section id="pastel_doce" class="tipos">
    <h2>PASTÉIS DOCES</h2>
    <div id="lista-produtos-doces"></div>
  </section>

  <section id="bebidas" class="tipos">
    <h2>BEBIDAS</h2>
    <div id="lista-produtos-bebidas"></div>
  </section>

  <div class="autor">
    <p>Desenvolvido por <a href="https://wa.me/5516988472113" target="_blank">Cassiano - WhatsApp</a></p>
  </div>
</main>

<footer>
  <div class="carrinho-info">
    <span>Total: R$ <span id="valor-total">0,00</span></span>
    <button id="btn-finalizar">Ver Carrinho (<span id="quantidade-carrinho">0</span>)</button>
  </div>
</footer>

<div id="popup-carrinho" class="popup-container">
  <div class="popup-conteudo">
    <button id="btn-fechar">X</button>
    <h2>Seu Pedido</h2>
    
    <div id="lista-carrinho"></div>
    <div id="valor-total-popup">
        Total: <span id="valor-total-popup-valor">R$ 0,00</span>
    </div>

    <hr>

    <div class="campo-form">
      <label for="nome-cliente">Seu Nome:</label>
      <input type="text" id="nome-cliente" placeholder="Digite seu nome" required>
    </div>

    <div class="campo-form">
        <label>Tipo de Pedido:</label>
        <div class="radio-group">
            <input type="radio" id="tipo-entrega" name="tipo-pedido" value="entrega" checked>
            <label for="tipo-entrega">Entrega</label>
            <input type="radio" id="tipo-retirada" name="tipo-pedido" value="retirada">
            <label for="tipo-retirada">Retirada no Local</label>
        </div>
    </div>

    <div id="campos-entrega-container" style="display: flex;">
        <div class="campo-form">
            <label for="endereco-cliente">Seu Endereço:</label>
            <input type="text" id="endereco-cliente" placeholder="Rua, número, bairro" required>
        </div>
        <div class="campo-form">
            <label>Forma de Pagamento:</label>
            <div class="radio-group">
                <input type="radio" id="pagamento-dinheiro" name="forma-pagamento" value="dinheiro">
                <label for="pagamento-dinheiro">Dinheiro</label>
                <input type="radio" id="pagamento-cartao" name="forma-pagamento" value="cartao">
                <label for="pagamento-cartao">Cartão</label>
            </div>
        </div>
        <div class="campo-form" id="campo-troco-container" style="display: none;">
            <label for="troco-pedido">Precisa de troco para quanto?</label>
            <input type="number" id="troco-pedido" placeholder="Ex: 50 (deixe em branco se não precisar)">
        </div>
    </div>
    
     <button id="btn-enviar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        <span>Finalizar Pedido</span>
    </button>
  </div>
</div>

<script src="script.js" defer></script>

</body>
</html>
